name: cctv-ocr
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cctv-ocr
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor
          pip install pillow
      - name: 읽기
        run: python3 ocr.py
      - name: data 브랜치에 올리기
        run: |
          mkdir -p /tmp/out && cp data/* /tmp/out/
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf . -q
          cp /tmp/out/* .
          git add -A
          git commit -q -m "cctv $(date -u +%FT%TZ)"
          git push -f origin data
