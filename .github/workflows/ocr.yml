name: cctv-ocr
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cctv-ocr
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor
          pip install pillow
      - name: 읽기
        run: python3 ocr.py
      - name: data 브랜치에 올리기
        run: |
          cp data/cctv.json /tmp/cctv.json
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf . -q
          mkdir -p . && cp /tmp/cctv.json cctv.json
          git add cctv.json
          git commit -q -m "cctv $(date -u +%FT%TZ)"
          git push -f origin data
